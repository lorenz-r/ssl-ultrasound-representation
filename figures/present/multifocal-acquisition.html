<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multifocal Acquisition — Figure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        /* TUM CAMP deck palette */
        --tum-blue:        #3070b3;
        --tum-blue-dark:   #072140;
        --tum-blue-mid:    #5e94d4;
        --tum-blue-light:  #9abce4;
        --tum-blue-pale:   #c9ddf2;
        --ink:             #111316;
        --gray-text:       #6a7077;
        --gray-line:       #d9dde2;
        --gray-fill:       #f4f6f8;
        --accent-red:      #c4161c;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px;
    }

    .figure {
        width: 100%;
        max-width: 1440px;
    }

    /* ---- TUM-style heading ---- */
    .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--tum-blue);
        margin: 0 0 6px;
    }
    .eyebrow .sep { color: var(--gray-text); font-weight: 400; }

    .title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 22px;
        color: var(--ink);
    }

    /* ---- figure frame ---- */
    .panel {
        position: relative;
        width: 100%;
    }
    svg { display: block; width: 100%; height: auto; }

    .mono { font-family: "Roboto Mono", monospace; }

    /* ---- live status strip ---- */
    .status {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 22px;
        margin-top: 18px;
        font-family: "Roboto Mono", monospace;
        font-size: 12px;
        color: var(--gray-text);
    }
    .status .item { display: flex; align-items: baseline; gap: 7px; }
    .status .k { text-transform: uppercase; letter-spacing: 0.04em; font-size: 10.5px; }
    .status .v { color: var(--ink); font-weight: 500; }
    .status .v b { color: var(--tum-blue); }
    .status .dot { width: 9px; height: 9px; display: inline-block; }

    .controls { margin-left: auto; }
    button.play {
        font-family: "Roboto Mono", monospace;
        font-size: 12px;
        color: var(--tum-blue);
        background: #fff;
        border: 1px solid var(--tum-blue);
        padding: 6px 14px;
        cursor: pointer;
        transition: background .15s, color .15s;
    }
    button.play:hover { background: var(--tum-blue); color: #fff; }

    /* ---- caption ---- */
    .caption {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid var(--gray-line);
        font-family: "Roboto Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        color: var(--gray-text);
        display: flex;
        justify-content: space-between;
        gap: 16px;
    }
</style>
</head>
<body>
    <figure class="figure">
        <p class="eyebrow">Background <span class="sep">-</span> Data</p>
        <h1 class="title">Multifocal Acquisition</h1>

        <div class="panel">
            <svg id="sim" viewBox="0 0 900 372" xmlns="http://www.w3.org/2000/svg">
                <!-- tissue field -->
                <rect x="60" y="52" width="727.5" height="278" fill="#ffffff" stroke="var(--gray-line)" stroke-width="1"/>

                <!-- single full-aperture receive (all 192 channels at once) -->
                <g class="mono">
                    <rect id="rx-aper" x="60" y="16" width="720" height="10"
                          fill="rgba(154,188,228,0.45)" stroke="rgba(48,112,179,0.8)" stroke-width="1" stroke-dasharray="3,3"/>
                    <text x="60" y="12" fill="var(--tum-blue)" font-size="8.5" font-weight="500">RX - 192 ch (full aperture)</text>
                </g>

                <!-- probe housing, transducer grid, then TX window on top -->
                <rect x="60" y="30" width="720" height="22" fill="none" stroke="#9aa3ad" stroke-width="1.5"/>
                <g id="array-elements"></g>
                <rect id="tx-aperture-rect" x="60" y="30" width="180" height="22"
                      fill="rgba(48,112,179,0.32)" stroke="var(--tum-blue)" stroke-width="2"/>
                <text id="tx-ap-label" class="mono" x="150" y="45" fill="var(--tum-blue)" font-size="8.5"
                      text-anchor="middle" font-weight="500">TX 64</text>
                <text class="mono" x="792" y="44" fill="var(--gray-text)" font-size="9" font-weight="500">192 elem</text>

                <!-- scan-line indicator -->
                <line id="scanline-indicator" x1="420" y1="52" x2="420" y2="330"
                      stroke="var(--tum-blue)" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6"/>

                <!-- beam triangles (filled), redrawn by JS -->
                <path id="beam-deep"    fill="rgba(154,188,228,0.16)" stroke="none"/>
                <path id="beam-mid"     fill="rgba(94,148,212,0.16)"  stroke="none"/>
                <path id="beam-shallow" fill="rgba(7,33,64,0.10)"     stroke="none"/>

                <!-- focal-zone target rings (track the beam focus) -->
                <circle id="f1-ring" cx="420" cy="150" r="9"  fill="none" stroke="var(--tum-blue-dark)"  stroke-width="2"/>
                <circle id="f2-ring" cx="420" cy="217" r="12" fill="none" stroke="var(--tum-blue)"       stroke-width="2"/>
                <circle id="f3-ring" cx="420" cy="282" r="15" fill="none" stroke="var(--tum-blue-light)" stroke-width="2"/>

                <!-- focal-zone labels, fixed at the graphic centre -->
                <g class="mono" font-size="10">
                    <text id="f1-label" x="423" y="153" text-anchor="middle" fill="var(--tum-blue-dark)">F1 - 17.7 mm</text>
                    <text id="f2-label" x="423" y="220" text-anchor="middle" fill="var(--tum-blue)">F2 - 29.6 mm</text>
                    <text id="f3-label" x="423" y="285" text-anchor="middle" fill="#6f9bd0">F3 - 41.4 mm</text>
                </g>

                <!-- depth ruler -->
                <g class="mono" font-size="9" fill="var(--gray-text)">
                    <line x1="787.5" y1="52" x2="787.5" y2="330" stroke="#b8bec6" stroke-width="1"/>
                    <line x1="781.5" y1="52"  x2="793.5" y2="52"  stroke="#b8bec6" stroke-width="1"/>
                    <line x1="781.5" y1="191" x2="793.5" y2="191" stroke="#b8bec6" stroke-width="1"/>
                    <line x1="781.5" y1="330" x2="793.5" y2="330" stroke="#b8bec6" stroke-width="1"/>
                    <text x="799.5" y="55">0 mm</text>
                    <text x="799.5" y="194">25 mm</text>
                    <text x="799.5" y="333">50 mm</text>
                    <text x="858" y="191" text-anchor="middle" fill="#475569" font-weight="500"
                          transform="rotate(90,858,191)">2560 samples (depth)</text>
                </g>

                <!-- scan-line ruler -->
                <g class="mono" font-size="8.5" fill="var(--gray-text)">
                    <line x1="60" y1="342" x2="780" y2="342" stroke="#b8bec6" stroke-width="0.8"/>
                    <line x1="60"  y1="338" x2="60"  y2="346" stroke="#b8bec6" stroke-width="1"/>
                    <line x1="780" y1="338" x2="780" y2="346" stroke="#b8bec6" stroke-width="1"/>
                    <text x="60" y="358">SL 1</text>
                    <text x="420" y="358" text-anchor="middle" fill="var(--tum-blue)" font-weight="500">← 192 lateral scan lines →</text>
                    <text x="780" y="358" text-anchor="end">192</text>
                </g>
            </svg>
        </div>

        <!-- live status -->
        <div class="status">
            <div class="item">
                <span class="dot" style="background:var(--tum-blue-dark)"></span>
                <span class="k">Scan line</span>
                <span class="v mono"><b id="dim-scanline">001</b> / 192</span>
            </div>
            <div class="item">
                <span class="k">Focal zone</span>
                <span class="v mono"><b id="dim-focalzone">1</b> / 3</span>
            </div>
            <div class="item">
                <span class="k">Events</span>
                <span class="v mono"><b id="events-done">0</b> / 576</span>
            </div>
            <div class="controls">
                <button class="play" id="btn-trigger-foci">▶ Trigger loop</button>
            </div>
        </div>

        <div class="caption">
            <span>192 scan lines × 3 foci = 576 events - 192 ch × 2,560 samples each</span>
            <span>Lorenz Rasbach - Mu He - Ben Barkow</span>
        </div>
    </figure>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const NS = 'http://www.w3.org/2000/svg';
    const $ = id => document.getElementById(id);

    // ---- geometry ----
    const probeLeft = 60, probeW = 720, probeBottom = 52, txW = 180;
    const NUM_ELEMENTS = 48;   // transducer elements shown on screen = animated scan-line stops
    const focalY   = [150, 217, 282];          // F1, F2, F3 depths
    const beamHalf = [39, 60, 87];             // aperture half-width per zone
    const zoneFill = ['rgba(7,33,64,0.12)', 'rgba(48,112,179,0.16)', 'rgba(154,188,228,0.20)'];

    // ---- transducer element ticks ----
    const arr = $('array-elements');
    for (let i = 0; i < NUM_ELEMENTS; i++) {
        const x = probeLeft + (i / (NUM_ELEMENTS - 1)) * probeW;
        const t = document.createElementNS(NS, 'line');
        t.setAttribute('x1', x); t.setAttribute('y1', 30);
        t.setAttribute('x2', x); t.setAttribute('y2', 52);
        t.setAttribute('stroke', '#c2c8cf'); t.setAttribute('stroke-width', '0.7');
        arr.appendChild(t);
    }

    const beamTris = ['beam-shallow', 'beam-mid', 'beam-deep'].map($);
    const rings  = ['f1-ring',  'f2-ring',  'f3-ring' ].map($);

    function updateAcqState(stop, fz) {
        const scanX = probeLeft + (stop / (NUM_ELEMENTS - 1)) * probeW;
        const scanLine = Math.round(stop / (NUM_ELEMENTS - 1) * 191) + 1;  // mapped to real 1..192
        const txLeft = Math.max(probeLeft, Math.min(scanX - txW / 2, probeLeft + probeW - txW));
        const cx = txLeft + txW / 2;   // transmitter-window centre = fixed cone origin

        $('tx-aperture-rect').setAttribute('x', txLeft);
        $('tx-ap-label').setAttribute('x', cx);
        $('scanline-indicator').setAttribute('x1', scanX);
        $('scanline-indicator').setAttribute('x2', scanX);

        // beams: origin pinned to the TX-window centre, apex on the true scan line (skews near the edges)
        for (let i = 0; i < 3; i++) {
            const h = beamHalf[i], fy = focalY[i];
            const active = i === fz;
            beamTris[i].setAttribute('d',
                `M${cx - h},${probeBottom} L${cx + h},${probeBottom} L${scanX},${fy} Z`);
            beamTris[i].setAttribute('fill', active ? zoneFill[i] : 'rgba(148,163,184,0.05)');
            rings[i].setAttribute('cx', scanX);
            rings[i].setAttribute('opacity', active ? '1' : '0.35');
            rings[i].setAttribute('stroke-width', active ? '2.4' : '1.4');
        }

        // status readout
        $('dim-scanline').textContent = String(scanLine).padStart(3, '0');
        $('dim-focalzone').textContent = fz + 1;
        $('events-done').textContent = ((scanLine - 1) * 3 + fz + 1).toLocaleString();
    }

    // ---- acquisition loop ----
    let loop = null;
    function trigger() {
        if (loop) clearInterval(loop);
        let step = 0; // (48 visible stops × 3 foci)
        const total = NUM_ELEMENTS * 3;
        updateAcqState(0, 0);
        loop = setInterval(() => {
            const stop = Math.floor(step / 3);
            const fz = step % 3;
            updateAcqState(stop, fz);
            step++;
            if (step >= total) step = 0;
        }, 130);
    }

    $('btn-trigger-foci').addEventListener('click', trigger);
    trigger();
});
</script>
</body>
</html>
