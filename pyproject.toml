[project]
name = "ssl-ultrasound-representation"
version = "0.1.0"
description = "Self-supervised latent space learning for ultrasound image representation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.0",
  "matplotlib>=3.5",
  "numpy>=1.24",
  "pymust (>=0.1.9,<0.2.0)",
  "zarr (<3)",
  "numcodecs (<0.16)",
  "tqdm (>=4.68.1,<5.0.0)",
  "huggingface-hub (>=0.20)",
  # PyTorch 2.4.1+cu118: last build with Pascal (sm_61) kernels (e.g. TITAN Xp).
  # Install via: pip install torch==2.4.1+cu118 --index-url https://download.pytorch.org/whl/cu118
  "torch (>=2.4.1,<2.5)",
  "wandb (>=0.27.2,<0.28.0)",
]

[tool.poetry]
packages = [{ include = "ssl_ultrasound_representation", from = "src" }]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
