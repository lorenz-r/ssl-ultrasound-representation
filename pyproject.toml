[project]
name = "ssl-ultrasound-representation"
version = "0.1.0"
description = "Self-supervised latent space learning for ultrasound image representation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.0",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "pymust (>=0.1.9,<0.2.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
