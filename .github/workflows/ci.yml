name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # zea (WI-3/4/16, offline beamforming) picks a Keras backend at import time
  # and defaults to tensorflow, which is not installed here — torch already
  # is (it's the training dependency), so reuse it rather than adding a
  # second deep-learning framework just to satisfy the import.
  KERAS_BACKEND: torch

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # torch (CUDA wheels) + JAX + transformers fill the runner's ~14 GB free
      # disk before the tests finish; drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install -E dev

      - name: Lint
        run: poetry run ruff check .

      - name: Test (smoke tier — no full-dataset downloads)
        run: poetry run pytest -q
